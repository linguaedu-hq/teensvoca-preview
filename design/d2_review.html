<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>오늘 복습 | Lingua Teens Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Caveat:wght@700&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="practice.css?v=1">
<style>
/* 복습 상자 세 칸 + 다 외운 칸 : 연필로 그린 상자 */
.boxes{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 16px;padding:0}
.bx{position:relative;min-height:84px;padding:8px 4px 6px;text-align:center;color:var(--brown)}
.bx svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.bx svg path{fill:none;stroke:#cdbba0;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bx.cur svg path{stroke:var(--ink);stroke-width:2.6}
.bx .c{display:block;font-family:Caveat;font-size:36px;line-height:1;color:var(--ink)}
.bx .c.bump{animation:bump .26s var(--ease-out)}
.bx b{display:block;font-family:Jua;font-weight:400;font-size:15px;line-height:1.2;margin-top:2px}
.bx small{display:block;font-size:12px;color:var(--mute);line-height:1.3}
.bx.out .c{color:var(--g-ink)}
@keyframes bump{from{transform:translateY(-6px);opacity:.3}}

/* 단계 : 보기 · 가리고 쓰기 · 확인 */
.steps{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0 0 10px;padding:0;list-style:none;font-size:14px;color:#a3958a}
.steps li{display:flex;align-items:center;gap:6px}
.steps li.on{color:var(--ink);font-family:Jua;font-size:15px}
.steps li.past{color:var(--mute)}
.steps i{display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.6}

.stage{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-height:76px;margin:2px 0 4px}
.stage .word{padding-right:4px}
/* 가리는 쪽지 : 대시보드 「가리고 외우기」와 같은 노란 쪽지 */
.cover{position:absolute;left:-12px;top:-6px;bottom:-6px;width:min(340px,calc(100% + 12px));display:flex;align-items:center;justify-content:center;border-radius:2px 8px 4px 2px;
  background:var(--y);color:var(--brown);font-family:"Nanum Pen Script";font-size:28px;box-shadow:0 1px 0 #edb03355,0 8px 14px -8px #67391b55;
  transform:translateX(-24px) rotate(-1.6deg);opacity:0;pointer-events:none;transition:transform .22s var(--ease-out),opacity .18s var(--ease-out)}
.covered .cover{transform:rotate(-1.6deg);opacity:1}
.before{margin:0;font-size:14px;color:var(--mute);display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.before .mine{font-size:30px}
.before i{font-style:normal}
.res{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px dashed #e4d3b2;min-height:60px}
.res .fix{font-size:44px;line-height:1}
.res .mv{flex-basis:100%;margin:0;font-family:Jua;font-size:16px;color:var(--brown)}
.res .mv.up{color:var(--g-ink)}
.again{display:inline-block;margin-left:6px;font-family:"Gowun Dodum";font-size:13px;color:var(--mute);vertical-align:middle}

.endlist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.endlist li{position:relative;display:grid;grid-template-columns:58px 1fr auto;align-items:center;min-height:58px;border-bottom:1px solid var(--rule)}
.endlist .n{position:relative;text-align:center;font-family:Caveat;font-size:22px;color:#7a6a60}
.endlist .w{font-family:"Nanum Pen Script";font-size:36px;line-height:1;color:var(--ink)}
.endlist .w small{display:block;font-family:"Gowun Dodum";font-size:13px;color:var(--mute);line-height:1.5}
.endlist .w small.up{color:var(--g-ink)}
.empty .ask-s{margin-bottom:6px}
@media (max-width:420px){.bx{min-height:80px}.bx .c{font-size:32px}.bx b{font-size:14px}}
@media (prefers-reduced-motion:reduce){.cover{transition:none}.bx .c.bump{animation:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></svg>

<header class="top">

  <img src="assets/lingua_teens_logo.svg?v=2" alt="Lingua Teens" width="118" height="33">
</header>
<main>
<h1>오늘 복습</h1>
<p class="sub" id="sub"></p>
<ol class="boxes" id="boxes" aria-label="복습 상자"></ol>
<section class="paper" id="card" aria-labelledby="card-ask" aria-live="polite"></section>
<div class="dock" id="dock"></div>
</main>
<p class="note">시안용 가짜 데이터(학생 한 명 Mia) <button type="button" id="wipe">복습 기록 지우기</button></p>
</div>
