<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>단어 퀴즈 | Lingua Teens Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Caveat:wght@700&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="practice.css?v=1">
<style>
/* 문제 번호 줄 : 시험지 번호처럼. 푼 문제엔 빨간 펜 표시 */
.strip{list-style:none;display:flex;flex-wrap:wrap;gap:2px;margin:0 0 12px;padding:0}
.strip li{position:relative;width:36px;height:40px;display:grid;place-items:center;font-family:Caveat;font-size:22px;color:#a3958a}
.strip li.now{color:var(--ink)}
.strip li.now::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:2.5px;border-radius:2px;background:var(--ink)}
.strip li.did{color:var(--pencil)}
.strip .mark{width:36px;height:30px;margin:-16px 0 0 -18px}

/* 바른 철자 고르기 : 줄 공책 한 줄씩 */
.opts{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule)}
.opt{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:62px;padding:4px 10px;border:0;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;text-align:left;
  font-family:"Nanum Pen Script";font-size:40px;line-height:1;color:var(--pencil);transition:background-color .15s ease}
@media (hover:hover) and (pointer:fine){.opt:not([disabled]):hover{background:#fcd3772e}}
.opt:active{background:#fcd37745}
.opt[disabled]{cursor:default}
.opt .t{position:relative;display:inline-block}
.opt .ring{position:absolute;left:-14px;top:-8px;width:calc(100% + 28px);height:calc(100% + 16px);overflow:visible;pointer-events:none}
.opt .ring path{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .34s var(--ease-pen) .05s forwards;opacity:0;filter:url(#ink)}

/* 빠진 글자 채우기 */
.slots{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;margin:10px 0 18px;font-family:"Nanum Pen Script";font-size:52px;line-height:1.05;color:var(--ink)}
.slots .ch{display:inline-block;min-width:.32em;text-align:center}
.gap{display:inline-grid;place-items:center;width:46px;height:58px;padding:0;border:0;border-bottom:3px solid var(--b-ink);border-radius:4px 4px 0 0;background:#158ab212;cursor:pointer;
  font-family:"Nanum Pen Script";font-size:50px;line-height:1;color:var(--b-ink);transition:background-color .15s ease}
.gap.next{background:#158ab226}
.gap[disabled]{cursor:default}
.gap.bad{color:var(--pencil);border-bottom-color:var(--red)}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:56px;height:60px;border:0;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 2px var(--paper-edge),0 3px 0 var(--paper-edge);cursor:pointer;
  font-family:"Nanum Pen Script";font-size:44px;line-height:1;color:var(--ink);transition:transform .12s var(--ease-out),opacity .15s ease,box-shadow .12s var(--ease-out)}
.tile:active{transform:translateY(2px) scale(.97);box-shadow:inset 0 0 0 2px var(--paper-edge),0 1px 0 var(--paper-edge)}
.tile[disabled]{opacity:.28;cursor:default;transform:none}

/* 듣고 쓰기 */
.listen{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.len{margin:6px 0 0;font-size:14px;color:var(--mute)}

/* 채점 결과 줄 */
.res{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:16px;padding-top:12px;border-top:1px dashed #e4d3b2;min-height:64px}
.res .ok{font-family:"Nanum Pen Script";font-size:40px;line-height:1;color:var(--ink)}
.res .fix{font-size:44px;line-height:1}
.res .nx{flex-basis:100%;margin:0;font-size:14px;color:var(--mute)}

/* 끝 */
.end-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;min-height:100px}
.total{position:relative;flex:0 0 auto;width:120px;height:94px;text-align:center}
.total svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.total svg path{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw .55s var(--ease-pen) .15s forwards;filter:url(#ink)}
.total .v{position:relative;display:block;font-family:Caveat;color:var(--red);font-size:48px;line-height:94px;clip-path:inset(0 100% 0 0);animation:write .32s var(--ease-out) .6s forwards}
.total .v small{font-size:24px}
.end-h .praise{margin-top:8px;animation-delay:.9s}
.endlist{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--rule)}
.endlist li{position:relative;display:grid;grid-template-columns:58px 1fr auto;align-items:center;min-height:56px;border-bottom:1px solid var(--rule)}
.endlist .n{position:relative;text-align:center;font-family:Caveat;font-size:22px;color:#7a6a60}
.endlist .w{font-family:"Nanum Pen Script";font-size:36px;line-height:1;color:var(--ink)}
.endlist .w small{display:block;font-family:"Gowun Dodum";font-size:13px;color:var(--mute);line-height:1.4}
.endlist .w small s{text-decoration-color:var(--red);text-decoration-thickness:2px}
.end-p{margin:14px 0 0;font-size:16px}
.end-p b{font-family:Jua;font-weight:400}
@media (max-width:420px){.opt{font-size:36px}.slots{font-size:46px}.gap{width:42px;height:54px;font-size:46px}.tile{width:52px;height:58px}}
@media (prefers-reduced-motion:reduce){.opt .ring path,.total svg path{animation:none;opacity:1;stroke-dashoffset:0}.total .v{animation:none;clip-path:none}.tile,.gap,.opt{transition:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></svg>
