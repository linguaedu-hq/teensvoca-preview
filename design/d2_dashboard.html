<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>내 단어시험 (기록 칸 A안) | Lingua Teens Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Caveat:wght@700&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* Lingua Teens 로고 색 */
  --y:#fcd377;--y2:#edb033;--red:#d71718;--red-dk:#9e0f10;--g:#89b929;--g-ink:#4d7a12;--b:#158ab2;--b-ink:#0f6f90;--brown:#673a1b;--ink:#221815;
  /* 종이·먹 */
  --ground:#fff8ea;--paper:#fffdf6;--paper-edge:#ecdcbc;--rule:#d3e4f0;--margin:#f0a3a3;--pencil:#3f3732;--mute:#6e5f55;--track:#f1e8d6;
  --row:42px;--ease-out:cubic-bezier(.23,1,.32,1);--ease-io:cubic-bezier(.77,0,.175,1);--ease-pen:cubic-bezier(.65,0,.35,1);
  --shadow-paper:0 1px 0 #67391b14,0 12px 28px -8px #67391b2e;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--ground);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;word-break:keep-all;overflow-wrap:anywhere;caret-color:var(--red)}
::selection{background:var(--y);color:var(--ink)}
:focus-visible{outline:3px solid var(--b-ink);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 48px}

/* 머리 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;flex-direction:column;gap:2px}.brand img{display:block;width:150px;height:auto}
.brand small{display:block;font-size:13px;color:var(--mute);padding-left:2px}
.acct{display:flex;align-items:center;gap:4px}
.acct .nm{font-family:Jua;font-size:16px;padding:0 6px}
.out{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--mute);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.out:hover{color:var(--ink)}
h1{font-family:Jua;font-weight:400;font-size:clamp(28px,6vw,36px);line-height:1.15;margin:14px 0 4px;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(transparent 58%,var(--y) 58%);padding:0 2px}
.sub{color:var(--mute);margin:0 0 10px;font-size:16px}
.sub b{color:var(--ink);font-weight:400;font-family:Jua}
/* 다시 외울 단어로 가는 길 : 칩이 아니라 글 속 밑줄 링크(손이 닿는 면은 넉넉히) */
.sub .jump{display:inline-block;margin:-10px 0 -10px 4px;padding:10px 2px;color:var(--b-ink);font-family:Jua;white-space:nowrap;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.sub .jump:hover{color:var(--ink)}

/* 날짜 흐름 : 주마다 묶고, 칸은 날짜(요일)만 짧게. 90점 이상 날은 손그림 웃는 얼굴 */
.flow{position:relative;display:flex;gap:18px;align-items:flex-end;overflow-x:auto;padding:10px 14px 16px;scrollbar-width:thin;scrollbar-color:var(--y2) transparent;
  -webkit-mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%)}
.flow::-webkit-scrollbar{height:6px}.flow::-webkit-scrollbar-thumb{background:var(--y2);border-radius:3px}
.wk{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.wk-l{position:sticky;left:14px;align-self:flex-start;display:flex;align-items:baseline;gap:6px;padding:0 6px 0 2px;background:var(--ground);border-radius:4px;font-family:Jua;font-size:15px;color:var(--brown);white-space:nowrap}
.wk-l small{font-family:"Gowun Dodum";font-size:12px;color:var(--mute)}
.wk-days{display:flex;gap:6px;padding:6px 8px;margin:0 -8px;border-radius:10px}
.wk.now .wk-days{background:#fcd37738}
.day{position:relative;flex:0 0 auto;width:60px;min-height:72px;border:2px solid var(--paper-edge);border-radius:8px;background:#fff;padding:7px 2px 5px;text-align:center;cursor:pointer;
  transition:transform .16s var(--ease-out),border-color .16s ease}
@media (hover:hover) and (pointer:fine){.day:hover{transform:translateY(-2px)}}.day:active{transform:scale(.97)}
.day .d{display:block;font-size:13px;color:var(--mute);line-height:1.2;white-space:nowrap}
.day .d b{font-family:Jua;font-weight:400;font-size:15px;color:var(--ink)}
.day .smile{position:absolute;right:-10px;top:-12px;width:24px;height:24px;transform:rotate(8deg)}
.day .s{display:block;font-family:Caveat;font-size:28px;color:var(--red);line-height:1.15}
.day .s.wait{font-family:"Nanum Pen Script";font-size:22px;line-height:1.5}
.day.today:not(.graded){border-style:dashed;border-color:var(--red)}
/* 고른 날 : 잉크 테두리 + 아래 시험지로 이어지는 꼭지(덧그림자 대신) */
.day[aria-pressed="true"]{border-color:var(--ink);border-style:solid;background:var(--paper)}
.day[aria-pressed="true"]::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;margin-left:-6px;background:var(--paper);border:solid var(--ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.day.stamp .s{animation:stamp .28s var(--ease-out) both}
@keyframes stamp{0%{opacity:0;transform:scale(1.3) rotate(-6deg)}100%{opacity:1;transform:none}}

/* 시험지 + 옆 칸 */
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:4px;align-items:start}
.side{display:grid;gap:20px;align-content:start;min-width:0}

.sheet{position:relative;background:var(--paper);border-radius:3px 3px 5px 5px;box-shadow:var(--shadow-paper);overflow:clip;
  background-image:linear-gradient(90deg,transparent 52px,var(--margin) 52px,var(--margin) 54px,transparent 54px)}
.sheet-h{position:relative;padding:18px 136px 12px 70px;min-height:112px}
.sheet h2{font-family:Jua;font-weight:400;font-size:22px;line-height:1.2;margin:0 0 4px}
.sheet .meta{font-size:14px;color:var(--mute);line-height:1.45}
.items{list-style:none;margin:0;padding:0 0 24px;font-family:"Nanum Pen Script";font-size:30px;line-height:1;
  background:repeating-linear-gradient(transparent 0 calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px) var(--row));background-position:0 0}
.items li{position:relative;display:grid;grid-template-columns:52px 1fr;align-items:end;height:var(--row);padding-bottom:7px}
.items .n{position:relative;justify-self:center;width:34px;text-align:center;font-family:Caveat;font-size:21px;color:#7a6a60;line-height:1}
.items .ans{display:flex;align-items:flex-end;gap:12px;padding-left:16px;min-width:0}
.items .w{position:relative;color:var(--pencil);white-space:nowrap}
.items .w.blank{display:inline-block;width:3.2em;height:1px}
.items .fix{color:var(--red);white-space:nowrap;clip-path:inset(0 100% 0 0)}
.mark{position:absolute;left:50%;top:50%;width:46px;height:38px;margin:-21px 0 0 -23px;overflow:visible;pointer-events:none}
.mark path{opacity:0;fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:url(#ink)}
.strike{position:absolute;left:-3px;right:-3px;top:56%;height:2.6px;border-radius:2px;background:var(--red);transform-origin:left;transform:scaleX(0) rotate(-2deg)}
.total{position:absolute;right:16px;top:10px;width:116px;height:92px;text-align:center}
.total svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.total svg path{opacity:0;fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:url(#ink)}
.total .v{position:relative;display:block;font-family:Caveat;color:var(--red);font-size:48px;line-height:92px;clip-path:inset(0 100% 0 0)}
.total .v small{font-size:24px}
/* 채점 전 점수 자리 : 빈 점선 동그라미만(점수·정답 없음) */
.total.wait svg path{opacity:1;stroke:#cdbba0;stroke-width:2.4;stroke-dasharray:.035 .03;stroke-dashoffset:0;filter:none}
.total.wait .v{clip-path:none;font-family:"Nanum Pen Script";font-size:28px;color:var(--mute)}
.praise{position:absolute;right:20px;top:102px;font-family:"Nanum Pen Script";color:var(--red);font-size:30px;line-height:1;transform:rotate(-7deg);clip-path:inset(0 100% 0 0)}

/* 채점이 끝난(고정) 모습 */
.done .mark path,.done .total svg path{opacity:1;stroke-dashoffset:0}
.done .fix,.done .total .v,.done .praise{clip-path:inset(0 0 0 0)}
.done .strike{transform:scaleX(1) rotate(-2deg)}
/* 채점 중 : 빨간 펜이 위에서 아래로 */
.run .mark path{animation:draw .28s var(--ease-pen) var(--t) forwards}
.run li.x .mark path{animation-duration:.16s}
.run .strike{animation:strike .16s var(--ease-out) calc(var(--t) + .12s) forwards}
.run .fix{animation:write .34s var(--ease-pen) calc(var(--t) + .26s) forwards}
.run .total svg path{animation:draw .55s var(--ease-pen) var(--t) forwards}
.run .total .v{animation:write .32s var(--ease-out) calc(var(--t) + .45s) forwards}
.run .praise{animation:write .4s var(--ease-out) calc(var(--t) + .85s) forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
@keyframes strike{to{transform:scaleX(1) rotate(-2deg)}}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.redpen{position:absolute;left:0;top:0;width:84px;height:84px;pointer-events:none;opacity:0;z-index:4;filter:drop-shadow(2px 6px 4px #67391b40)}
.fade-in{animation:fade .2s var(--ease-out) both}@keyframes fade{from{opacity:0}}

/* 채점하기 : 내 답은 또렷하게 두고, 버튼은 엄지 닿는 아래에 붙인다 */
.cta{position:sticky;bottom:0;z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px;padding:30px 16px calc(18px + env(safe-area-inset-bottom));
  background:linear-gradient(#fffdf600,#fffdf6 26px);box-shadow:0 -1px 0 #fffdf6;transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
.cta.leave{opacity:0;transform:translateY(10px);pointer-events:none}
.cta.leave .gwrap{animation:none}
.gwrap{position:relative;animation:hop 2.4s var(--ease-pen) infinite}
.gwrap .ring{position:absolute;inset:-4px;border-radius:999px;border:3px solid var(--red);opacity:0;animation:ring 2.4s var(--ease-out) infinite;pointer-events:none}
.gbtn{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:68px;font-family:Jua;font-size:30px;color:#fff;background:var(--red);border:0;border-radius:999px;
  padding:12px 38px 12px 26px;cursor:pointer;box-shadow:0 5px 0 var(--red-dk),0 14px 24px -8px #9e0f1066;transition:transform .12s var(--ease-out),box-shadow .12s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.gbtn:hover{transform:translateY(-2px)}}
.gbtn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 var(--red-dk),0 4px 10px -4px #9e0f1055}
.gbtn:focus-visible{outline:4px solid var(--b-ink);outline-offset:6px;border-radius:999px}
.gbtn[disabled]{cursor:progress}
.gbtn .pen{width:38px;height:38px;flex:0 0 auto;animation:wiggle 2.4s var(--ease-pen) infinite;transform-origin:20% 80%}
.gbtn.loading .pen{animation:busy .32s linear infinite}
.cta.busy .gwrap,.cta.busy .ring{animation:none}
.hint{position:relative;order:-1;margin:0 0 10px;padding-right:40px;font-family:"Nanum Pen Script";font-size:28px;line-height:1.1;color:var(--brown);text-align:center}
.hint svg{position:absolute;right:0;top:4px;width:34px;height:40px;overflow:visible}
.hint svg path{fill:none;stroke:var(--brown);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.err:empty{display:none}
.err{margin-top:10px;color:var(--red-dk);font-size:15px;min-height:1.5em;text-align:center}
@keyframes hop{0%,40%,100%{transform:translateY(0)}14%{transform:translateY(-9px)}26%{transform:translateY(0)}33%{transform:translateY(-3px)}}
@keyframes ring{0%,25%{opacity:0;transform:scale(1)}27%{opacity:.55;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.3)}}
@keyframes wiggle{0%,40%,100%{transform:rotate(0)}8%{transform:rotate(-12deg)}17%{transform:rotate(12deg)}26%{transform:rotate(-8deg)}33%{transform:rotate(4deg)}}
@keyframes busy{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}

/* 다시 외울 단어 : 시험지 옆 쪽지 한 장(카드 속 카드 없이 줄 공책) */
.memo{position:relative;background:var(--paper);border-radius:3px;box-shadow:var(--shadow-paper);padding:16px 18px 8px;scroll-margin-top:16px}
.memo[hidden]{display:none}
.memo-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 6px}
.memo h3{font-family:Jua;font-weight:400;font-size:20px;line-height:1.25;margin:0}
.memo h3 b{font-weight:400;color:var(--b-ink)}
.memo .when{display:block;font-family:"Gowun Dodum";font-size:13px;color:var(--mute);margin-top:2px}
/* 가리고 외우기 : 덮개와 같은 노란 쪽지 */
.peek{flex:0 0 auto;min-height:44px;padding:0 16px;border:0;border-radius:2px 8px 3px 2px;background:var(--y);color:var(--brown);font-family:"Nanum Pen Script";font-size:25px;line-height:1;cursor:pointer;
  transform:rotate(1.5deg);box-shadow:0 1px 0 #edb03366,0 6px 10px -6px #67391b66;transition:transform .14s var(--ease-out),background-color .15s ease}
.peek:active{transform:rotate(1.5deg) scale(.97)}
.peek[aria-pressed="true"]{background:#fff;box-shadow:inset 0 0 0 2px var(--y2);transform:none}
.wcs{list-style:none;margin:0;padding:0}
.wc{position:relative;padding:8px 2px 10px;border-top:1px solid var(--rule)}
.wc .right{position:relative;display:inline-block;font-family:"Nanum Pen Script";font-size:44px;line-height:1.05;color:var(--ink);letter-spacing:.01em}
.wc .right mark{background:linear-gradient(transparent 52%,var(--y) 52%,var(--y) 92%,transparent 92%);color:inherit;padding:0 1px;border-radius:2px}
.wc .mine{display:flex;align-items:baseline;gap:8px;margin-top:2px;font-size:14px;color:var(--mute)}
.wc .mine span{font-family:"Nanum Pen Script";font-size:26px;color:var(--pencil);line-height:1}
.wc .mine u{text-decoration:underline 2.5px var(--red);text-underline-offset:4px}
.wc .mine i{font-style:normal;font-size:14px;color:var(--mute)}
.wc .cover{position:absolute;left:-10px;right:-14px;top:-2px;bottom:-4px;min-width:150px;padding:0 16px;display:flex;align-items:center;justify-content:center;border:0;border-radius:2px 8px 4px 2px;
  background:var(--y);color:var(--brown);font-family:"Nanum Pen Script";font-size:26px;cursor:pointer;box-shadow:0 1px 0 #edb03355,0 8px 14px -8px #67391b55;transform:rotate(-1.6deg);
  transition:transform .2s var(--ease-out),opacity .2s var(--ease-out)}
.wc .cover:active{transform:rotate(-1.6deg) scale(.97)}
.wc.open .cover{opacity:0;transform:translate(14px,-10px) rotate(6deg);pointer-events:none}
.memo .clear,.miss .clear{font-family:"Nanum Pen Script";font-size:30px;color:var(--g-ink);position:relative;display:inline-block}
.memo .clear svg,.miss .clear svg{position:absolute;left:-4px;right:-4px;bottom:-6px;width:calc(100% + 8px);height:10px}
.memo.fade-in{animation:fade .24s var(--ease-out) both}

/* 자주 틀린 단어(기록 칸 아래, 어느 안이든 같은 모양) */
.miss{margin-top:16px;padding-top:12px;border-top:1px dashed #e4d3b2}
.miss h3{font-family:Jua;font-weight:400;font-size:17px;margin:0 0 4px}
.miss ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:0 16px}
.miss li{font-family:"Nanum Pen Script";font-size:28px;color:var(--pencil);line-height:1.25}
.miss li small{font-family:"Gowun Dodum";font-size:13px;color:var(--mute);margin-left:4px}
.miss .none{margin:0;color:var(--mute);font-size:15px}

/*REC-CSS*/
/* 기록 칸 A · 통지표 : 세 기간을 한 표에. 그림 없이 숫자를 크게 */
.rec{background:var(--paper);border-radius:3px;box-shadow:var(--shadow-paper);padding:16px 18px 16px}
.rec-t{font-family:Jua;font-weight:400;font-size:20px;line-height:1.2;margin:0 0 8px}
.rc{width:100%;border-collapse:collapse;table-layout:fixed}
.rc col.c1{width:40%}.rc col.c2{width:32%}
.rc thead th{font-weight:400;font-size:13px;color:var(--mute);text-align:right;padding:0 0 6px;border-bottom:3px double var(--paper-edge)}
.rc thead th.c-me{color:var(--b-ink);font-family:Jua;font-size:15px}
.rc thead th.c-lv{color:var(--brown);font-family:Jua;font-size:15px}
.rc tbody th{font-family:Jua;font-weight:400;font-size:19px;line-height:1.2;text-align:left;padding:14px 0 0;vertical-align:top}
.rc tbody th small{display:block;margin-top:3px;font-family:"Gowun Dodum";font-size:13px;color:var(--mute)}
.rc td{text-align:right;vertical-align:top;padding:6px 0 0 6px;white-space:nowrap}
.rc .me{font-family:Caveat;font-weight:700;font-size:54px;line-height:1;color:var(--b-ink)}
.rc .lv{font-family:Caveat;font-weight:700;font-size:30px;line-height:1.6;color:var(--brown)}
.rc .u{font-size:.48em;margin-left:1px}
.rc .wait{font-family:"Nanum Pen Script";font-weight:400;font-size:28px;line-height:1.9;color:var(--mute)}
.rc .say td{text-align:left;padding:0 0 12px;font-family:"Nanum Pen Script";font-size:25px;line-height:1.1;color:var(--brown);border-bottom:1px solid var(--rule)}
.rc .say.up td{color:var(--g-ink)}
.rc tbody:last-of-type .say td{border-bottom:0;padding-bottom:4px}
.rc tbody.cur th{color:var(--ink)}
@media (max-width:420px){.rec{padding:14px 14px 12px}.rc .me{font-size:48px}}
/*/REC-CSS*/

.note{margin-top:28px;font-size:13px;color:var(--mute);text-align:center}
.note button,.note a{border:0;background:none;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px;padding:0 8px;display:inline-flex;align-items:center}

@media (min-width:900px){.brand img{width:176px}}
@media (max-width:899px){.grid{grid-template-columns:1fr}}
@media (max-width:420px){
  .sheet-h{padding:16px 112px 10px 66px;min-height:104px}
  .total{right:6px;top:8px;transform:scale(.86);transform-origin:right top}
  .praise{right:10px;top:92px;font-size:26px}
  .items{font-size:28px}
  .gbtn{font-size:27px;min-height:62px;padding:10px 30px 10px 22px}
  .memo{padding:14px 14px 6px}
}
@media (prefers-reduced-motion:reduce){
  .gwrap,.gwrap .ring,.gbtn .pen,.gbtn.loading .pen,.day.stamp .s{animation:none}
  .gwrap .ring{opacity:.45}
  .gbtn,.day,.cta,.wc .cover,.peek{transition:none}
}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></svg>
<div class="wrap">
<header class="top">
  <div class="brand"><img src="assets/lingua_teens_logo.svg?v=2" alt="Lingua Teens" width="150" height="42"><small>단어시험 채점</small></div>
  <div class="acct"><span class="nm" id="who"></span><button class="out" id="logout" type="button">로그아웃</button></div>
</header>
<main>
<h1>안녕, <em id="nm"></em>!</h1>
<p class="sub" id="sub" aria-live="polite"></p>
<nav class="flow" id="flow" aria-label="날짜별 시험지"></nav>
<div class="grid">
  <section class="sheet" id="sheet" aria-labelledby="sheet-title"></section>
  <div class="side">
  <section class="memo" id="memo" aria-labelledby="memo-title" hidden></section>
<!--REC-HTML-->
  <section class="rec" aria-labelledby="rec-title">
    <h2 class="rec-t" id="rec-title">정답률</h2>

<script src="data.js?v=6"></script>
<script>
// 로그인한 학생 한 명 : 실제로는 서버가 이 학생 것만 내려준다(다른 학생 결과는 페이지에 없음)
const ME = { name: "Mia", cls: "LIV1-4" };
const API = TV.student(ME.name, ME.cls);
const TODAY = API.history[API.history.length - 1];
const $ = id => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const KEY = d => `tv-graded-${ME.cls}-${ME.name}-${d}`;
// 지난 날은 이미 채점(고정). 오늘 것만 학생이 처음 열 때 「채점하기」. 한 번 채점하면 고정.
const isGraded = d => d !== TODAY || store.get(KEY(d)) === "1";
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const rate = rs => { const q = rs.reduce((a,r)=>a+r.q,0), c = rs.reduce((a,r)=>a+r.correct,0); return { q, c, p: q ? Math.round(c*100/q) : 0 }; };
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
let day = TODAY, tab = "day", busy = false;

// 손으로 그린 동그라미 : 문항마다 조금씩 다르게(같은 문항은 늘 같은 모양)
function rnd(seed){ let s = seed * 9301 + 49297; return () => ((s = (s * 9301 + 49297) % 233280) / 233280); }
function handCircle(seed, w, h, turns = 1.12){
  const r = rnd(seed), cx = w/2, cy = h/2, pts = [], n = 10, a0 = -2.4 + r()*.4;
  for (let i = 0; i <= n; i++){ const a = a0 + (Math.PI*2*turns) * i/n, k = 1 + (r()-.5)*.14 - (i/n)*.05;
    pts.push([cx + Math.cos(a)*(w/2-3)*k, cy + Math.sin(a)*(h/2-3)*k]); }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length-1; i++){ const p0 = pts[i-1]||pts[i], p1 = pts[i], p2 = pts[i+1], p3 = pts[i+2]||p2;
    const c1 = [p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6], c2 = [p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
    d += ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`; }
  return d;
}
function handSlash(seed){ const r = rnd(seed); return `M${(5+r()*4).toFixed(1)} ${(34+r()*3).toFixed(1)} Q${(20+r()*4).toFixed(1)} ${(22-r()*4).toFixed(1)} ${(40+r()*3).toFixed(1)} ${(3+r()*3).toFixed(1)}`; }

const PEN = `<svg viewBox="0 0 84 84" aria-hidden="true"><g transform="rotate(-38 42 42)"><rect x="18" y="35" width="56" height="14" rx="3" fill="#d71718" stroke="#221815" stroke-width="2"/><rect x="58" y="35" width="7" height="14" fill="#9e0f10"/><path d="M18 35 L4 42 L18 49 Z" fill="#fce9c8" stroke="#221815" stroke-width="2" stroke-linejoin="round"/><path d="M8.5 39.6 L4 42 L8.5 44.4 Z" fill="#d71718"/><rect x="66" y="31" width="12" height="4" rx="2" fill="#221815"/></g></svg>`;
const BTN_PEN = `<svg class="pen" viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-40 20 20)"><rect x="9" y="15" width="27" height="10" rx="2" fill="#fcd377" stroke="#fff" stroke-width="2"/><rect x="30" y="15" width="6" height="10" fill="#fff"/><path d="M9 15 L1 20 L9 25 Z" fill="#fce9c8" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M3.6 18.5 L1 20 L3.6 21.5 Z" fill="#221815"/></g></svg>`;
const ARROW = `<svg viewBox="0 0 34 40" aria-hidden="true"><path d="M4 4 C20 6 28 16 22 34"/><path d="M14 28 L22 36 L29 27"/></svg>`;
// 손으로 그린 웃는 얼굴(로그인 화면과 같은 결) : 칭찬 기준 90점 이상인 날만
const SMILE = `<svg class="smile" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.4c5.3-.2 9.4 3.6 9.5 9.2.1 5.5-4 9.9-9.4 9.9-5.4.1-9.6-4.1-9.6-9.4C2.5 6.6 6.4 2.6 12 2.4Z" fill="#fcd377" stroke="#673a1b" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.6 9.6v1.6M15.3 9.4v1.7" stroke="#673a1b" stroke-width="1.8" stroke-linecap="round"/><path d="M7.6 14.2c1.4 2.4 6.6 2.7 8.9-.3" fill="none" stroke="#673a1b" stroke-width="1.7" stroke-linecap="round"/></svg>`;
const ULINE = `<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C25 2 55 9 98 4" fill="none" stroke="#89b929" stroke-width="3" stroke-linecap="round"/></svg>`;

// 날짜 계산(시안 데이터는 2026년)
const WD = ["일","월","화","수","목","금","토"];
const dateOf = d => new Date(2026, +d.slice(0,2)-1, +d.slice(2));
const mondayOf = d => { const t = dateOf(d); t.setDate(t.getDate() - ((t.getDay()+6)%7)); return t; };

function renderTop(){
  $("who").textContent = ME.name; $("nm").textContent = ME.name;
  const sub = $("sub");
  if (day === TODAY && !isGraded(day)) sub.innerHTML = "오늘 시험지가 도착했어요. <b>채점하기</b>를 눌러 보세요.";
  else { const r = API.result(day); sub.innerHTML = `${day === TODAY ? "오늘" : TV.label(day)} <b>${r.q}문제 중 ${r.correct}문제</b> 맞혔어요.${r.wrong ? ` <a class="jump" href="#memo">다시 외울 단어 ${r.wrong}개</a>` : ''}`; }
}
function renderFlow(stampDay, smooth){
  const flow = $("flow"), m0 = mondayOf(TODAY).getTime(), weeks = new Map();
  API.history.forEach(d => { const k = mondayOf(d).getTime(); if (!weeks.has(k)) weeks.set(k, []); weeks.get(k).push(d); });
  const rel = k => { const n = Math.round((m0 - k) / (7*864e5)); return n === 0 ? "이번 주" : n === 1 ? "지난주" : `${n}주 전`; };
  flow.innerHTML = [...weeks.entries()].map(([k, ds]) => { const mon = new Date(k);
    return `<div class="wk${k === m0 ? ' now' : ''}" role="group" aria-label="${rel(k)}"><span class="wk-l">${rel(k)}<small>${mon.getMonth()+1}월 ${mon.getDate()}일~</small></span><div class="wk-days">${ds.map(d => {
      const g = isGraded(d), r = g ? API.result(d) : null, isT = d === TODAY, dt = dateOf(d);
      return `<button type="button" class="day${isT?' today':''}${g?' graded':''}${d===stampDay?' stamp':''}" data-d="${d}" aria-pressed="${d===day}" aria-label="${TV.label(d)} ${WD[dt.getDay()]}요일 ${g ? r.score+'점' : '채점 전'}">
        ${g && r.score >= 90 ? SMILE : ''}<span class="d">${isT ? '<b>오늘</b>' : `<b>${dt.getDate()}</b>일 ${WD[dt.getDay()]}`}</span>${g ? `<span class="s">${r.score}</span>` : '<span class="s wait">채점 전</span>'}</button>`; }).join("")}</div></div>`; }).join("");
  const on = flow.querySelector('[aria-pressed="true"]');
  if (on) { const left = Math.max(0, on.offsetLeft + on.offsetWidth - flow.clientWidth + 24);   // 고른 칸이 오른쪽 끝에 오도록(지난 날이 왼쪽에 보이게)
    if (smooth && !reduced()) flow.scrollTo({ left, behavior: "smooth" }); else flow.scrollLeft = left; }
}
function sheetHead(s){

// 채점 전: 학생이 쓴 단어만. 정답·맞음 여부·점수는 DOM 에 없다.
function renderBlank(){

  el.innerHTML = sheetHead(s) + `<div class="total wait" aria-hidden="true"><svg viewBox="0 0 116 92"><path pathLength="1" d="${handCircle(s.q*13, 116, 92, 1.0)}"/></svg><span class="v">채점 전</span></div></div>
    <ol class="items">${s.words.map(w => `<li><span class="n">${w.no}</span><span class="ans">${w.wrote ? `<span class="w">${esc(w.wrote)}</span>` : '<span class="w blank"></span>'}</span></li>`).join("")}</ol>
    <div class="cta" id="cta"><div class="gwrap"><span class="ring"></span>

// 채점된 시험지. animate = 빨간 펜이 지금 매기는 연출
function renderGraded(r, animate){
  const el = $("sheet"), step = Math.min(.22, Math.max(.12, 2.8 / r.q));
  let t = .35; const times = [];
  const items = r.items.map(it => { const at = t; times.push({ no: it.no, at, ok: it.ok }); t += step + (it.ok ? 0 : .6);
    const mark = it.ok ? handCircle(it.no*7+3, 46, 38) : handSlash(it.no*5+1);
    const word = it.wrote ? `<span class="w">${esc(it.wrote)}${it.ok ? '' : '<span class="strike"></span>'}</span>` : '<span class="w blank"></span>';
    return `<li${it.ok ? "" : ' class="x"'} style="--t:${at.toFixed(2)}s" data-no="${it.no}"><span class="n">${it.no}<svg class="mark" viewBox="0 0 46 38" aria-hidden="true"><path pathLength="1" d="${mark}"/></svg></span>
      <span class="ans">${word}${it.ok ? '' : `<span class="fix">${esc(it.ans)}</span>`}</span><span class="vh">${it.ok ? '맞음' : '틀림, 정답 ' + esc(it.ans)}</span></li>`; }).join("");
  const tt = t + .15;
  const praise = r.score === 100 ? '참 잘했어요!' : r.score >= 90 ? '훌륭해요!' : '';
  el.className = "sheet " + (animate ? "run" : "done");
  el.innerHTML = sheetHead(r) + `<div class="total" style="--t:${tt.toFixed(2)}s" aria-label="${r.q}문제 중 ${r.correct}문제 맞음"><svg viewBox="0 0 116 92" aria-hidden="true"><path pathLength="1" d="${handCircle(r.q*13+r.correct, 116, 92, 1.08)}"/></svg><span class="v">${r.correct}<small>/${r.q}</small></span></div>
    ${praise ? `<div class="praise" style="--t:${tt.toFixed(2)}s">${praise}</div>` : ''}</div><ol class="items">${items}</ol>`;
  return { times, end: tt + (praise ? 1.35 : 0.9) };
}
// 빨간 펜이 문항을 차례로 찾아가며 매긴다(Web Animations)
function runPen(times, end){
  const el = $("sheet"), pen = document.createElement("div"), box = el.getBoundingClientRect();
  pen.className = "redpen"; pen.innerHTML = PEN; el.appendChild(pen);
  const at = (node, dx = 0, dy = 0) => { const b = node.getBoundingClientRect(); return [b.left - box.left + b.width/2 + dx, b.top - box.top + b.height/2 + dy]; };
  const pos = (x, y) => `translate(${(x - 6).toFixed(1)}px, ${(y - 66).toFixed(1)}px)`;   // 펜 끝(6,66)을 점에 맞춘다
  const frames = [{ t: 0, x: box.width + 30, y: 40, o: 0 }];
  times.forEach(({ no, at: t, ok }) => { const li = el.querySelector(`li[data-no="${no}"]`), [x, y] = at(li.querySelector(".n"));
    frames.push({ t: Math.max(0, t - .1), x: x - 12, y: y - 8, o: 1 }, { t: t + .22, x: x + 10, y: y + 6, o: 1 });
    if (!ok) { const f = li.querySelector(".fix"), [fx, fy] = at(f); const w = f.getBoundingClientRect().width;
      frames.push({ t: t + .24, x: fx - w/2, y: fy + 6, o: 1 }, { t: t + .58, x: fx + w/2, y: fy + 4, o: 1 }); } });
  const [tx, ty] = at(el.querySelector(".total"));
  const tt = parseFloat(el.querySelector(".total").style.getPropertyValue("--t"));
  frames.push({ t: tt, x: tx - 30, y: ty - 30, o: 1 }, { t: tt + .7, x: tx + 20, y: ty + 10, o: 1 }, { t: end - .2, x: tx + 70, y: ty - 40, o: 0 });
  const T = end; frames.sort((a, b) => a.t - b.t);   // 시간순(겹치는 구간이 있어도 Web Animations 오프셋은 늘 오름차순)
  pen.animate(frames.map(f => ({ transform: pos(f.x, f.y), opacity: f.o, offset: Math.min(1, f.t / T), easing: "cubic-bezier(.65,0,.35,1)" })),   // 구간마다 가속·감속(등속 미끄럼 X)
    { duration: T * 1000, easing: "linear", fill: "forwards" }).finished.then(() => pen.remove()).catch(() => pen.remove());
}
async function grade(){
  if (busy) return; busy = true;
  const btn = $("gbtn"), err = $("err");
  btn.disabled = true; btn.classList.add("loading"); $("cta").classList.add("busy"); btn.querySelector(".lbl").textContent = "불러오는 중"; err.textContent = "";
  let r;
  try { r = await API.fetchGrade(day); }
  catch (e) { busy = false; btn.disabled = false; btn.classList.remove("loading"); $("cta").classList.remove("busy"); btn.querySelector(".lbl").textContent = "채점하기";
    err.textContent = "채점을 불러오지 못했어요. 다시 눌러 주세요."; return; }
  store.set(KEY(day), "1");               // 한 번 채점되면 고정
  const cta = $("cta"); cta.classList.add("leave");
  const settle = () => { busy = false; renderTop(); renderFlow(day); renderMemo(true); renderStat(); };
  if (reduced()) { renderGraded(r, false); $("sheet").classList.add("fade-in"); settle(); return; }
  setTimeout(() => { const { times, end } = renderGraded(r, true); try { runPen(times, end); } catch (e) { document.querySelectorAll(".redpen").forEach(n => n.remove()); }
    setTimeout(settle, end * 1000); }, 200);
}

// ── 기록 칸이 쓰는 숫자(어느 안이든 같은 계산) ──
// 레벨 평균: 같은 레벨 전체의 맞힌 문제 / 전체 문제(숫자 하나). 다른 학생 이름·점수는 쓰지 않는다.
const levelRate = ds => { const t = ds.reduce((a, d) => { const x = API.levelTotal(d); return { c: a.c + x.c, q: a.q + x.q }; }, { c: 0, q: 0 }); return { ...t, p: t.q ? Math.round(t.c*100/t.q) : 0 }; };
const statOf = ds => ({ ds, R: rate(ds.map(d => API.result(d))), A: levelRate(ds) });
function groupBy(ds, keyFn){ const m = new Map(); ds.forEach(d => { const k = keyFn(d); if (!m.has(k)) m.set(k, []); m.get(k).push(d); }); return [...m.entries()].map(([k, g]) => ({ k, ...statOf(g) })); }
const weekKey = d => mondayOf(d).getTime(), monthKey = d => +d.slice(0, 2);
// 고른 날 기준 : 그날 · 그 주 · 그 달(채점된 날만 센다)
function recModel(){
  const graded = API.history.filter(isGraded), wk = weekKey(day), mo = monthKey(day);
  const days = graded.map(d => ({ k: d, ...statOf([d]) })), weeks = groupBy(graded, weekKey), months = groupBy(graded, monthKey);
  const wAgo = Math.round((weekKey(TODAY) - wk) / (7*864e5)), mon = mondayOf(day);
  return { days, weeks, months, level: API.level,
    sel: isGraded(day) ? days.find(x => x.k === day) : null,
    selLabel: day === TODAY ? "오늘" : TV.label(day),
    week: weeks.find(x => x.k === wk) || null,
    weekLabel: wAgo === 0 ? "이번 주" : wAgo === 1 ? "지난주" : `${mon.getMonth()+1}월 ${mon.getDate()}일 주`,
    month: months.find(x => x.k === mo) || null,
    monthLabel: mo === monthKey(TODAY) ? "이번 달" : `${mo}월`, mo };
}
const diffTxt = (me, lv) => me > lv ? `평균보다 ${me - lv}%p 높아요` : me < lv ? `평균보다 ${lv - me}%p 낮아요` : "평균과 같아요";
// 자주 틀린 단어(여러 날을 모아 많이 틀린 순)
function missBlock(title, ds){
  const miss = {}; ds.forEach(d => API.result(d).wrongs.forEach(w => miss[w.ans] = (miss[w.ans] || 0) + 1));
  const words = Object.entries(miss).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const body = !ds.length ? '<p class="none">채점한 시험이 아직 없어요.</p>'
    : !words.length ? `<span class="clear">틀린 단어가 없어요${ULINE}</span>`
    : `<ul>${words.map(([w, n]) => `<li>${esc(w)}${n > 1 ? `<small>${n}번</small>` : ''}</li>`).join("")}</ul>`;
  return `<div class="miss"><h3>${title}</h3>${body}</div>`;
}

//REC-JS-START
function renderStat(){
  const M = recModel(), LV = esc(M.level);
  const rows = [[M.selLabel, M.sel, "채점 전"], [M.weekLabel, M.week, "아직 없어요"], [M.monthLabel, M.month, "아직 없어요"]];
  const body = rows.map(([k, s, none]) => s
    ? `<tbody><tr><th scope="row">${k}<small>${s.R.q}문제 중 ${s.R.c}문제</small></th><td class="me">${s.R.p}<span class="u">%</span></td><td class="lv">${s.A.p}<span class="u">%</span></td></tr>
        <tr class="say${s.R.p > s.A.p ? ' up' : ''}"><td colspan="3">${diffTxt(s.R.p, s.A.p)}</td></tr></tbody>`
    : `<tbody><tr><th scope="row">${k}</th><td class="wait" colspan="2">${none}</td></tr><tr class="say"><td colspan="3"></td></tr></tbody>`).join("");
  $("stat").innerHTML = `<table class="rc"><caption class="vh">기간별 내 정답률과 ${LV} 평균</caption><colgroup><col class="c1"><col class="c2"><col></colgroup>
      <thead><tr><th scope="col"><span class="vh">기간</span></th><th scope="col" class="c-me">나</th><th scope="col" class="c-lv">${LV} 평균</th></tr></thead>${body}</table>
    ${M.month ? missBlock(`${M.monthLabel} 자주 틀린 단어`, M.month.ds) : ''}`;
}
//REC-JS-END

function renderSheet(){ if (isGraded(day)) renderGraded(API.result(day), false); else renderBlank(); }
// 다시 외울 단어 쪽지. 채점된 날에만 있다(채점 전에는 정답이 화면에 없다).
// 내가 쓴 답과 정답을 글자 단위로 맞대어(LCS) 다른 글자만 짚는다: 정답 쪽은 노란 형광펜, 내 답 쪽은 빨간 밑줄(채점 표시).
function lcsMarks(a, b){
  const A = [...a.toLowerCase()], B = [...b.toLowerCase()], m = A.length, n = B.length;
  const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i+1][j+1] + 1 : Math.max(L[i+1][j], L[i][j+1]);
  const ka = new Array(m).fill(false), kb = new Array(n).fill(false); let i = 0, j = 0;
  while (i < m && j < n){ if (A[i] === B[j]) { ka[i] = kb[j] = true; i++; j++; } else if (L[i+1][j] >= L[i][j+1]) i++; else j++; }
  return { ka, kb };
}
const markUp = (word, keep, tag) => { let out = "", run = ""; const chars = [...word];
  chars.forEach((ch, k) => { if (keep[k]) { if (run) { out += `<${tag}>${esc(run)}</${tag}>`; run = ""; } out += esc(ch); } else run += ch; });
  return out + (run ? `<${tag}>${esc(run)}</${tag}>` : ""); };
let peekOn = false;
function renderMemo(fade){
  const el = $("memo");
  if (!isGraded(day)) { el.hidden = true; el.innerHTML = ""; return; }
  const r = API.result(day), ws = r.wrongs, when = day === TODAY ? "오늘" : TV.label(day);
  el.hidden = false; el.classList.toggle("fade-in", !!fade);
  if (!ws.length) { el.innerHTML = `<div class="memo-h"><h3 id="memo-title">다시 외울 단어<span class="when">${when} 시험</span></h3></div><span class="clear">틀린 단어가 없어요${ULINE}</span>`; return; }
  const cards = ws.map(w => { const { ka, kb } = lcsMarks(w.wrote || "", w.ans);
    const right = w.wrote ? markUp(w.ans, kb, "mark") : esc(w.ans);
    const mine = w.wrote ? `<span>${markUp(w.wrote, ka, "u")}</span>` : `<i>빈칸으로 냈어요</i>`;
    return `<li class="wc"><span class="right">${right}${peekOn ? `<button type="button" class="cover" aria-label="${w.no}번 정답 보기">눌러서 확인</button>` : ''}</span>
      <div class="mine">${w.no}번 · 내가 쓴 답 ${mine}</div></li>`; }).join("");
  el.innerHTML = `<div class="memo-h"><h3 id="memo-title">다시 외울 단어 <b>${ws.length}개</b><span class="when">${when} 시험</span></h3>
      <button type="button" class="peek" id="peek" aria-pressed="${peekOn}">${peekOn ? '다 보기' : '가리고 외우기'}</button></div>
    <ul class="wcs">${cards}</ul>`;
  $("peek").onclick = () => { peekOn = !peekOn; renderMemo(false); $("peek").focus(); };
  el.querySelectorAll(".cover").forEach(b => b.onclick = () => { b.closest(".wc").classList.add("open"); });
}
function renderAll(smooth){ renderTop(); renderFlow(undefined, smooth); renderSheet(); renderMemo(false); renderStat(); }

$("flow").onclick = e => { const b = e.target.closest(".day"); if (!b || busy) return; day = b.dataset.d; renderAll(true); };
$("logout").onclick = () => { store.del("tv-auto"); location.href = "d2_login.html"; };
$("reset").onclick = () => { if (busy) return; store.del(KEY(TODAY)); day = TODAY; peekOn = false; renderAll(); };
renderAll();
</script></body></html>
