<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>로그인 | Lingua Teens Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--y:#fcd377;--y2:#edb033;--red:#d71718;--red-dk:#9e0f10;--g:#89b929;--b:#158ab2;--b-ink:#0f6f90;--brown:#673a1b;--ink:#221815;
  --ground:#fff8ea;--paper:#fffdf6;--rule:#d3e4f0;--margin:#f0a3a3;--mute:#6e5f55;--field:#e6d6b8;--row:36px;--ease-out:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px 16px 56px;font:16px/1.5 "Gowun Dodum",system-ui,sans-serif;color:var(--ink);caret-color:var(--red);
  background:var(--ground) radial-gradient(#edb03333 1.5px,transparent 1.6px) 0 0/22px 22px}
::selection{background:var(--y);color:var(--ink)}
:focus-visible{outline:3px solid var(--b-ink);outline-offset:3px}
.card{position:relative;width:min(420px,100%);background:var(--paper);border-radius:4px 4px 6px 6px;padding:34px 26px 30px 68px;
  box-shadow:0 1px 0 #67391b14,0 18px 36px -12px #67391b40;
  background-image:linear-gradient(90deg,transparent 50px,var(--margin) 50px,var(--margin) 52px,transparent 52px),repeating-linear-gradient(transparent 0 calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px) var(--row))}
.card::before{content:"";position:absolute;top:-13px;left:50%;width:112px;height:26px;margin-left:-56px;background:#fcd377d0;transform:rotate(-2deg)}
.logo{font-family:Jua;font-size:32px;line-height:1.08;margin:0}.logo b{color:var(--y2);font-weight:400}
.logo small{display:block;font-size:22px;color:var(--brown)}
.tag{display:inline-block;font-family:"Nanum Pen Script";color:var(--red);font-size:28px;line-height:1.1;margin:8px 0 18px;transform:rotate(-2deg)}
h1{position:relative;display:inline-block;font-family:Jua;font-weight:400;font-size:22px;margin:0 0 6px}
h1 svg{position:absolute;left:-4px;bottom:-7px;width:calc(100% + 8px);height:10px}
.f{margin-top:12px}
label{display:block;font-size:15px;color:var(--ink);margin:0 0 4px}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:17px;min-height:50px;padding:10px 14px;border:2px solid var(--field);border-radius:12px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s}
input:focus{border-color:var(--b-ink)}
input[aria-invalid="true"]{border-color:var(--red)}
.msg{min-height:1.4em;margin:4px 0 0;font-size:14px;color:var(--red-dk)}
.keep{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:4px;font-size:16px;cursor:pointer;width:max-content}
.keep input{width:22px;height:22px;margin:0;accent-color:var(--red)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;width:100%;min-height:56px;font-family:Jua;font-size:22px;border:0;border-radius:14px;background:var(--red);color:#fff;cursor:pointer;
  box-shadow:0 5px 0 var(--red-dk),0 12px 22px -8px #d7171866;transition:transform .12s var(--ease-out),box-shadow .12s}
.go svg{width:26px;height:18px;transition:transform .2s var(--ease-out)}
.go:hover svg{transform:translateX(4px)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red-dk)}
.help{margin:16px 0 0;font-size:14px;color:var(--mute);line-height:1.6}
.stamp{position:absolute;right:-14px;top:40px;width:92px;height:80px;transform:rotate(11deg);pointer-events:none}
.stamp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stamp path{opacity:0;fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s cubic-bezier(.3,.7,.4,1) .35s forwards;filter:url(#ink)}
.stamp span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Nanum Pen Script";color:var(--red);font-size:30px;line-height:.9;text-align:center;clip-path:inset(0 100% 0 0);animation:write .5s ease-out .9s forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}@keyframes write{to{clip-path:inset(0 0 0 0)}}
.pencil{position:absolute;left:12px;bottom:-30px;width:124px;transform:rotate(-22deg);pointer-events:none}
/* 자동 로그인 중 */
.auto{display:none;margin-top:6px}
.card.is-auto .auto{display:block}.card.is-auto .form{display:none}
.auto p{margin:0;font-size:17px}
.auto b{font-family:Jua;font-weight:400}.nw{white-space:nowrap}
.inkline{display:block;width:min(220px,100%);height:14px;margin-top:6px;overflow:visible}
.inkline path{fill:none;stroke:var(--red);stroke-width:3;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:inkgo 1.1s linear .05s forwards;filter:url(#ink)}
@keyframes inkgo{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
.other{margin-top:14px;min-height:44px;padding:0 4px;border:0;background:none;color:var(--b-ink);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media(max-width:420px){.card{padding:30px 18px 28px 62px}.stamp{right:-6px;top:6px;transform:rotate(11deg) scale(.82)}.logo{font-size:29px}}
@media (prefers-reduced-motion:reduce){.stamp path{animation:none;opacity:1;stroke-dashoffset:0}.stamp span{animation:none;clip-path:none}.inkline path{animation:none;opacity:1;stroke-dashoffset:0}.go,.go svg{transition:none}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="ink" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="1" seed="4"/><feDisplacementMap in="SourceGraphic" scale="1.4"/></filter></svg>
<main class="card" id="card">
  <div class="stamp" aria-hidden="true"><svg viewBox="0 0 92 80"><path pathLength="1" d="M18 22 C30 6 70 4 84 24 C96 42 78 70 48 74 C20 77 4 60 7 40 C9 28 20 16 36 12"/></svg><span>100<br>점!</span></div>
  <p class="logo">Lingua <b>Teens</b><small>Voca Check</small></p>
  <span class="tag">오늘 단어시험, 바로 채점해요</span>
  <form class="form" id="f" novalidate>
    <h1>학생 · 학부모 로그인<svg viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C25 2 55 9 98 4" fill="none" stroke="#fcd377" stroke-width="5" stroke-linecap="round"/></svg></h1>
    <div class="f"><label for="id">아이디</label><input id="id" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="예) 0000" aria-describedby="id-msg"><p class="msg" id="id-msg"></p></div>
    <div class="f"><label for="pw">비밀번호</label><input id="pw" type="password" autocomplete="current-password" aria-describedby="pw-msg"><p class="msg" id="pw-msg"></p></div>
    <label class="keep"><input type="checkbox" id="keep" checked> 다음부터 자동 로그인</label>
    <button class="go" type="submit">들어가기<svg viewBox="0 0 26 18" aria-hidden="true"><path d="M2 9.5 C8 8.5 15 9.5 23 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M16 3 L23.5 9 L16.5 15" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <p class="help">아이디와 비밀번호는 담임 선생님께 받아요.<br>학부모님도 같은 아이디로 들어와요.</p>
  </form>
  <div class="auto" id="auto" aria-live="polite">
    <p><b id="auto-id"></b> 계정으로 <span class="nw">자동 로그인 중</span></p><svg class="inkline" viewBox="0 0 220 14" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M3 9 C40 3 70 12 110 7 C150 2 180 11 217 6"/></svg>
    <button class="other" id="other" type="button">다른 아이디로 로그인</button>
  </div>
  <svg class="pencil" viewBox="0 0 120 22" aria-hidden="true"><rect x="0" y="4" width="90" height="14" rx="2" fill="#fcd377" stroke="#221815" stroke-width="2"/><rect x="0" y="4" width="14" height="14" fill="#f0a3a3" stroke="#221815" stroke-width="2"/><path d="M90 4 L112 11 L90 18 Z" fill="#fce9c8" stroke="#221815" stroke-width="2" stroke-linejoin="round"/><path d="M106 9.2 L112 11 L106 12.8 Z" fill="#221815"/></svg>
</main>
<script>
// 자동 로그인: 처음 한 번 아이디·비밀번호를 치면 다음부터 바로 들어간다.
// 비밀번호는 페이지에 저장하지 않는다. 실제판은 서버가 주는 로그인 토큰(오래 가는 쿠키)으로, 시안은 아이디만 기억한다.
// 브라우저의 「비밀번호 저장」도 쓰도록 autocomplete 를 달아 두었다.
const S = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
const $ = id => document.getElementById(id);
let timer = null;
const saved = S.get("tv-auto");
if (saved) {
  $("card").classList.add("is-auto"); $("auto-id").textContent = saved;
  timer = setTimeout(() => location.replace("d2_dashboard.html"), 1100);
}
$("other").onclick = () => { clearTimeout(timer); S.del("tv-auto"); $("card").classList.remove("is-auto"); $("id").focus(); };
function check(input, msgId, text){
  const bad = !input.value.trim(); input.setAttribute("aria-invalid", String(bad)); $(msgId).textContent = bad ? text : ""; return !bad;
}
$("f").onsubmit = e => {
  e.preventDefault();
  const okId = check($("id"), "id-msg", "아이디를 적어 주세요."), okPw = check($("pw"), "pw-msg", "비밀번호를 적어 주세요.");
  if (!okId) { $("id").focus(); return; } if (!okPw) { $("pw").focus(); return; }
  // 시안용 시험 계정(대표 10-14 지정) — 실제판은 서버(Supabase Auth)가 확인한다
  if ($("id").value.trim() !== "0000" || $("pw").value !== "0000") {
    $("pw").setAttribute("aria-invalid", "true"); $("pw-msg").textContent = "아이디 또는 비밀번호가 맞지 않아요."; $("pw").value = ""; $("pw").focus(); return;
  }
  if ($("keep").checked) S.set("tv-auto", $("id").value.trim()); else S.del("tv-auto");
  location.href = "d2_dashboard.html";
};
["id","pw"].forEach(k => $(k).addEventListener("input", () => { if ($(k).getAttribute("aria-invalid") === "true") check($(k), k + "-msg", ""); }));
</script>
</body></html>
