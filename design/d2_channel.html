<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>채널 추가 | Lingua Teens Voca</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="connect.css">
<link rel="stylesheet" href="kakao.css">
<style>
/* 채널 한 줄 : 카카오톡 채널 목록에서 보는 모습처럼 */
.ch{display:flex;align-items:center;gap:14px;margin:18px 0 4px;padding:14px 2px;border-top:2px dashed var(--paper-edge);border-bottom:2px dashed var(--paper-edge)}
.ch .av{flex:0 0 auto;display:grid;place-items:center;width:52px;height:52px;border-radius:18px;background:var(--brown);color:#fff;font-family:Jua;font-size:24px;line-height:1}
.ch b{display:block;font-family:Jua;font-weight:400;font-size:18px;line-height:1.3}
.ch small{display:block;font-size:13px;color:var(--mute)}
.ch .st{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--mute);white-space:nowrap}
.ch .st svg{width:18px;height:16px}
.ch.added .st{color:var(--b-ink);font-family:Jua;font-size:15px}
.kakao.add{margin-top:18px}
.kakao.add .sym{width:22px;height:22px;margin-top:-11px}
.state{margin:12px 0 0;font-size:15px;line-height:1.55}
.state.bad{color:var(--red-dk)}
.state:empty{display:none}
</style></head><body>
<header class="head">
  <img src="assets/lingua_teens_logo.svg?v=2" alt="Lingua Teens" width="128" height="36">
  <ol class="trail" aria-label="처음 들어오는 순서">
    <li><svg viewBox="0 0 14 12" aria-hidden="true"><path d="M2 6.5 L5.5 10 L12 2"/></svg>카카오 로그인</li>
    <li aria-current="step"><span class="todo" aria-hidden="true"></span>채널 추가</li>
    <li><span class="todo" aria-hidden="true"></span>우리 아이 연결</li>
  </ol>
</header>
<main class="card" aria-labelledby="h">
  <h1 id="h" tabindex="-1">링구아 채널을 추가해야 열려요<svg class="hl" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C25 2 55 9 98 4" fill="none" stroke="#fcd377" stroke-width="5" stroke-linecap="round"/></svg></h1>
  <p class="lead">학부모 안내와 단어시험 결과 알림이 이 채널로 와요.</p>

  <div class="ch" id="ch">
    <span class="av" aria-hidden="true">L</span>
    <span><b>링구아어학원 전국본원</b><small>카카오톡 채널</small></span>
    <span class="st" id="st">아직 안 함</span>
  </div>

  <button class="kakao add" id="add" type="button"><svg class="sym" viewBox="0 0 22 22" aria-hidden="true"><path fill="#000" d="M11 2.4C5.9 2.4 1.8 5.6 1.8 9.6c0 2.6 1.7 4.85 4.3 6.1l-1.1 4c-.1.34.29.6.57.41l4.8-3.2c.2.02.42.02.63.02 5.1 0 9.2-3.2 9.2-7.3S16.1 2.4 11 2.4Z"/><path d="M11 6.6v6M8 9.6h6" stroke="#FEE500" stroke-width="1.8" stroke-linecap="round"/></svg><span class="lbl">채널 추가하기</span></button>
  <button class="act" id="again" type="button" hidden>다시 확인<svg viewBox="0 0 24 16" aria-hidden="true"><path d="M2 8.5 C8 7.6 13 8.4 21 8"/><path d="M15 2.5 L21.5 8 L15.5 13.5"/></svg></button>
  <p class="state" id="state" role="status" aria-live="polite"></p>
  <p class="small">채널은 카카오톡에서 언제든 차단하거나 지울 수 있어요. 지우면 이 화면이 다시 보여요.</p>
  <button class="link" id="other" type="button">다른 카카오 계정으로 로그인</button>
</main>
<aside class="proto" aria-label="시안 보기">시안:
  <button type="button" data-ch="NONE">처음 모습</button><button type="button" data-ch="BLOCKED">차단해 둔 경우</button><a href="d2_login.html">로그인으로</a>
</aside>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="channel.js"></script>
</body></html>
